name: Apply AI hardware routing patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_ai_hardware_routing.py'
      - '.github/workflows/apply-ai-hardware-routing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/apply_ai_hardware_routing.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/sebrolens/vitalchronicle/android/Models.kt \
                  app/src/main/java/io/github/sebrolens/vitalchronicle/android/GeminiNanoEngine.kt \
                  app/src/main/java/io/github/sebrolens/vitalchronicle/android/VitalViewModel.kt \
                  app/src/main/java/io/github/sebrolens/vitalchronicle/android/OllamaModelCard.kt \
                  app/src/main/java/io/github/sebrolens/vitalchronicle/android/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: route local AI by actual phone acceleration [skip ci]'
          git push origin HEAD:main
