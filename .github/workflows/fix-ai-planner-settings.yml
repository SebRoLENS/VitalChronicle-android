name: Fix AI planner settings cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-ai-planner-settings.py
      - .github/workflows/fix-ai-planner-settings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove legacy fixed analysis interval selector
        run: python scripts/fix-ai-planner-settings.py
      - name: Commit application fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/sebrolens/vitalchronicle/android/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: remove legacy fixed AI analysis interval'
            git push
          fi
