name: Apply Android Personal Health Agent

on:
  push:
    branches: [feature/personal-health-agent]
    paths:
      - scripts/apply-personal-health-agent.py
      - .github/workflows/apply-personal-health-agent.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personal-health-agent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply Personal Health Agent integration
        run: python scripts/apply-personal-health-agent.py

      - name: Keep canonical workflow unchanged and chain the agent test into existing CI
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/android.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_ai_query_planner.py')
          text = p.read_text(encoding='utf-8')
          marker = '# Personal Health Agent bridge compatibility check'
          if marker not in text:
              text += '''\n\n# Personal Health Agent bridge compatibility check\nimport subprocess as _subprocess\nimport sys as _sys\n_subprocess.run([_sys.executable, "scripts/test_android_agent_bridge.py"], check=True)\n'''
              p.write_text(text, encoding='utf-8')
          PY

      - name: Keep patch helpers out of generated commit
        run: |
          git checkout HEAD -- scripts/apply-personal-health-agent.py
          git checkout HEAD -- .github/workflows/apply-personal-health-agent.yml

      - name: Commit generated Android integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat: add local Personal Health Agent on Android'
            git push origin HEAD:feature/personal-health-agent
          fi
