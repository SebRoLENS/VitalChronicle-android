name: Apply Personal AI overview wiring

on:
  push:
    branches:
      - feature/desktop-ai-parity

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-ai-parity
          fetch-depth: 0
      - name: Wire overview scores and first-run calibration
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/io/github/sebrolens/vitalchronicle/android/MainActivity.kt')
          text = main.read_text()
          marker = '''        }\n        if(vm.metrics.isEmpty()) item {'''
          replacement = '''        }\n        if (vm.personalAgentEnabled && vm.counts.isNotEmpty()) item { PersonalHealthScoresPanel(vm) }\n        if(vm.metrics.isEmpty()) item {'''
          if 'PersonalHealthScoresPanel(vm)' not in text:
              if marker not in text:
                  raise SystemExit('Overview insertion marker not found')
              text = text.replace(marker, replacement, 1)
          text = text.replace('"complete" else "not run"', '"complete" else "not complete"', 1)
          main.write_text(text)

          vm = Path('app/src/main/java/io/github/sebrolens/vitalchronicle/android/VitalViewModel.kt')
          text = vm.read_text()
          field_marker = '    private var analysisJob: Job? = null\n'
          if 'calibrationBootstrapChecked' not in text:
              if field_marker not in text:
                  raise SystemExit('ViewModel field marker not found')
              text = text.replace(field_marker, field_marker + '    private var calibrationBootstrapChecked = false\n', 1)

          parse_marker = '                metrics = parseMetricCards(dashboardJson)\n'
          calibration_block = '''                metrics = parseMetricCards(dashboardJson)\n                if (personalAgentEnabled && !calibrationBootstrapChecked) {\n                    calibrationBootstrapChecked = true\n                    val localAgentState = JSONObject(withContext(Dispatchers.Default) {\n                        core.personalAgentState(databasePath, agentDatabasePath)\n                    })\n                    val needsCalibration = localAgentState.optInt("calibration_version", 0) < 2 &&\n                        !localAgentState.optBoolean("calibration_pending", false)\n                    if (needsCalibration) {\n                        val calibration = JSONObject(withContext(Dispatchers.Default) {\n                            core.calibratePersonalAgent(\n                                databasePath,\n                                agentDatabasePath,\n                                java.util.Locale.getDefault().language,\n                            )\n                        })\n                        if (calibration.optBoolean("pending", false)) {\n                            status = "Personal AI calibration ready · answer the selected questions in AI"\n                        }\n                    }\n                    refreshPersonalAgentState()\n                }\n'''
          if 'val needsCalibration = localAgentState.optInt' not in text:
              if parse_marker not in text:
                  raise SystemExit('ViewModel dashboard marker not found')
              text = text.replace(parse_marker, calibration_block, 1)

          enable_marker = '''        if (enabled) refreshPersonalAgentState()\n'''
          enable_replacement = '''        if (enabled) {\n            calibrationBootstrapChecked = false\n            refreshPersonalAgentState()\n            refresh()\n        }\n'''
          if enable_marker in text:
              text = text.replace(enable_marker, enable_replacement, 1)
          vm.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-personal-ai-overview.yml
          git add app/src/main/java/io/github/sebrolens/vitalchronicle/android/MainActivity.kt \
                  app/src/main/java/io/github/sebrolens/vitalchronicle/android/VitalViewModel.kt
          git commit -m "Add Personal AI scores and adaptive first-run onboarding"
          git push origin HEAD:feature/desktop-ai-parity
