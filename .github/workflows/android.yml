name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Periodic compatibility check against the current VitalChronicle shared core.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout canonical VitalChronicle core
        uses: actions/checkout@v4
        with:
          repository: SebRoLENS/VitalChronicle
          ref: main
          path: upstream/VitalChronicle
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Sync canonical shared core
        run: >-
          python scripts/sync_shared_core.py
          --source upstream/VitalChronicle
          --dest app/src/main/python
          --assets app/src/main/assets

      - name: Show upstream revision
        run: cat app/src/main/assets/shared_core_revision.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read Android version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VitalChronicle-Android-${{ steps.version.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VitalChronicle-Android-${{ steps.version.outputs.version }}
          path: VitalChronicle-Android-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
